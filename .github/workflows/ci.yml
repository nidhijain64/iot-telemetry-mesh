name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - device-registry-service
          - data-ingestion-service
          - alert-rules-service
          - insight-agent
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      # Jest suites use isolated mocks — no external MongoDB or broker needed, so CI
      # doesn't have to stand up any services.
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Compose needs each service's .env to exist; the examples are enough to
      # prove the images build, since nothing connects at build time.
      - run: |
          for d in services/*/; do cp "$d/.env.example" "$d/.env"; done
      - run: docker compose build

  e2e:
    name: Cypress API and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            services/*/package-lock.json
      - name: Install service and dashboard dependencies
        run: |
          for d in services/* dashboard; do (cd "$d" && npm ci); done
      - name: Run isolated Cypress suite
        run: npm --prefix dashboard run test:e2e
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-screenshots
          path: dashboard/cypress/screenshots
          if-no-files-found: ignore
