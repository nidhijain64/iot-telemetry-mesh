name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - device-registry-service
          - data-ingestion-service
          - alert-rules-service
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      # The suites are pure unit tests — no MongoDB or broker needed, so CI
      # doesn't have to stand up any services.
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose needs each service's .env to exist; the examples are enough to
      # prove the images build, since nothing connects at build time.
      - run: |
          for d in services/*/; do cp "$d/.env.example" "$d/.env"; done
      - run: docker compose build
