# ============================================================
# Render Blueprint — deploys the four services, the gateway, and the
# dashboard. Create it from the Render dashboard with
# "New +" -> "Blueprint", pointed at this repo.
#
# Service URLs are wired automatically with `fromService` — Render fills them
# in once the services exist, so there are no URLs to copy by hand and no way
# to leave a `localhost` value in production. `fromService` yields a bare
# hostname; the code adds the scheme (services/*/src/config/serviceUrl.js and
# dashboard/src/lib/url.js).
#
# Only real secrets are left as `sync: false`: MONGO_URI, JWT_SECRET and
# INTERNAL_SERVICE_KEY. Render prompts for those.
#
# The simulator is deliberately absent. It has to run continuously to
# produce data, and Render's free plan spins idle services down — see
# DEPLOY.md for how to point a locally-run simulator at this deployment,
# which is what you want for a demo anyway.
# ============================================================

services:
  # ---------- auth-service ----------
  - type: web
    name: auth-service
    runtime: node
    plan: free
    rootDir: services/auth-service
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      # Must be byte-identical across all four services — each verifies
      # tokens locally rather than calling back here.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 1h
      # The dashboard's URL, once it exists. Without it any site could
      # call this API from a logged-in user's browser.
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: iot-dashboard
          property: host
      - key: NODE_ENV
        value: production

  # ---------- device-registry-service ----------
  - type: web
    name: device-registry-service
    runtime: node
    plan: free
    rootDir: services/device-registry-service
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Shared secret for service-to-service calls with no human behind
      # them. Same value in data-ingestion and alert-rules.
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: iot-dashboard
          property: host
      - key: STALE_AFTER_MS
        value: "120000"
      - key: SWEEP_INTERVAL_MS
        value: "30000"
      - key: NODE_ENV
        value: production

  # ---------- data-ingestion-service ----------
  # Serves REST *and* the MQTT-over-WebSocket broker on one port, which is
  # what makes it deployable here at all — Render exposes exactly one port
  # per service.
  - type: web
    name: data-ingestion-service
    runtime: node
    plan: free
    rootDir: services/data-ingestion-service
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: iot-dashboard
          property: host
      - key: DEVICE_REGISTRY_URL
        fromService:
          type: web
          name: device-registry-service
          property: host
      - key: ALERT_SERVICE_URL
        fromService:
          type: web
          name: alert-rules-service
          property: host
      - key: RING_BUFFER_SIZE
        value: "50"
      - key: VIEWER_SCOPE_REFRESH_MS
        value: "30000"
      # Keep well below device-registry's STALE_AFTER_MS or devices flicker
      # offline between liveness reports.
      - key: LIVENESS_THROTTLE_MS
        value: "30000"
      - key: NODE_ENV
        value: production

  # ---------- alert-rules-service ----------
  - type: web
    name: alert-rules-service
    runtime: node
    plan: free
    rootDir: services/alert-rules-service
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: iot-dashboard
          property: host
      - key: DEVICE_REGISTRY_URL
        fromService:
          type: web
          name: device-registry-service
          property: host
      - key: TEMP_THRESHOLD_C
        value: "35"
      - key: BATTERY_THRESHOLD_PCT
        value: "20"
      - key: ALERT_COOLDOWN_MS
        value: "300000"
      - key: MOTION_SHAKE_THRESHOLD
        value: "25"
      - key: SOUND_BASELINE_WINDOW
        value: "20"
      - key: SOUND_Z_SCORE_THRESHOLD
        value: "2.5"
      # Optional Slack incoming webhook. Empty is fine — critical alerts are
      # logged instead of posted. `value: ""` rather than `sync: false` so
      # Render treats it as set-and-empty instead of prompting for it.
      - key: ALERT_WEBHOOK_URL
        value: ""
      - key: NODE_ENV
        value: production

  # ---------- api-gateway ----------
  - type: web
    name: api-gateway
    runtime: node
    plan: free
    rootDir: services/api-gateway
    buildCommand: npm ci
    startCommand: node src/index.js
    envVars:
      - key: AUTH_URL
        fromService:
          type: web
          name: auth-service
          property: host
      - key: DEVICE_REGISTRY_URL
        fromService:
          type: web
          name: device-registry-service
          property: host
      - key: INGESTION_URL
        fromService:
          type: web
          name: data-ingestion-service
          property: host
      - key: ALERT_URL
        fromService:
          type: web
          name: alert-rules-service
          property: host
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: iot-dashboard
          property: host
      - key: NODE_ENV
        value: production

  # ---------- dashboard (static) ----------
  # Vite inlines every VITE_* value at BUILD time, so these are build
  # inputs, not runtime config: changing one needs a rebuild, not a restart.
  - type: web
    name: iot-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: api-gateway
          property: host
      # Points at data-ingestion, NOT the gateway: the gateway proxies HTTP
      # only, and a WebSocket upgrade does not survive it. The frontend adds
      # the wss:// scheme itself (see dashboard/src/lib/url.js).
      - key: VITE_MQTT_WS_URL
        fromService:
          type: web
          name: data-ingestion-service
          property: host
    routes:
      # Client-side routing: without this, loading /login or /mobile-node
      # directly (or refreshing on them) 404s, because no such file exists.
      - type: rewrite
        source: /*
        destination: /index.html
