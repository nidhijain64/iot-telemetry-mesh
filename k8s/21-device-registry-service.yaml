# Device registry. The stale-device sweep is idempotent across replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-registry-service
  namespace: telemetry
spec:

  replicas: 2
  selector:
    matchLabels: { app: device-registry-service }
  template:
    metadata:
      labels: { app: device-registry-service }
    spec:
      containers:
        - name: device-registry-service
          image: iot-telemetry-mesh-device-registry-service:latest
          # Images are loaded with minikube image load; do not pull from a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
          envFrom:
            - configMapRef: { name: telemetry-config }
            - secretRef: { name: telemetry-secrets }
          resources:
            # Reserve memory and CPU; cap memory while allowing CPU bursts.
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          # Readiness gates traffic: fail and the Pod is pulled out of the
          # Service, but nothing is restarted. This is what stops requests
          # reaching a Pod that is still connecting to MongoDB.
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          # Liveness restarts. Deliberately far more forgiving than readiness —
          # restarting a Pod that is merely busy makes an overload worse.
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: device-registry-service
  namespace: telemetry
spec:
  selector: { app: device-registry-service }
  ports:
    - port: 3002
      targetPort: 3002
