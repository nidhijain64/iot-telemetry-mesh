# auth-service — users, password hashing, token issuing.
#

apiVersion: apps/v1
kind: Deployment #keeps a set number of copies runnign
metadata:
  name: auth-service
  namespace: telemetry
spec:

  replicas: 2
  selector: # these labels are how the service finds these pods later
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: iot-telemetry-mesh-auth-service:latest # the docker image it runs
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          envFrom:
            - configMapRef: { name: telemetry-config }
            - secretRef: { name: telemetry-secrets }
          resources:
            # requests decide scheduling — how much the node must reserve.
            # limits are the hard ceiling; exceeding memory gets the container
            # killed. No CPU limit on purpose: CPU is throttled rather than
            # fatal, and a ceiling just adds latency under burst.
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          # Readiness gates traffic: fail and the Pod is pulled out of the
          # Service, but nothing is restarted. This is what stops requests
          # reaching a Pod that is still connecting to MongoDB.
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          # Liveness restarts. Deliberately far more forgiving than readiness —
          # restarting a Pod that is merely busy makes an overload worse.
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: telemetry
spec:
  selector: { app: auth-service }
  ports:
    - port: 3001
      targetPort: 3001
