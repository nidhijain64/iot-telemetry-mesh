# Ephemeral shared state: MQTT sessions, recent readings, alert baselines and rate limits.
# Durable readings and alerts live in MongoDB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: telemetry
spec:
  # One replica, same as mongo, and for a related reason: the services treat this
  # as a single source of truth for the debounce lock. Redis HA is Sentinel or
  # Cluster, which is a StatefulSet and a different exercise.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Evict cache keys when memory is full; baseline windows rebuild from new readings.
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
            # No appendonly/save: nothing here is worth persisting (see above).
            - --save
            - ""
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 320Mi } # headroom over maxmemory for overhead
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: telemetry
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
