# Enable the ingress controller first: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telemetry
  namespace: telemetry
  annotations:
    # Allow long-lived MQTT WebSocket connections through the ingress.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: telemetry.local
      http:
        paths:
          # data-ingestion is addressed directly rather than through the
          # gateway: the gateway proxies HTTP, and a WebSocket upgrade does not
          # survive that hop.
          - path: /mqtt
            pathType: Prefix
            backend:
              service:
                name: data-ingestion-service
                port: { number: 3003 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 3005 }
