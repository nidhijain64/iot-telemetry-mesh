# Shared non-secret settings. Credentials belong in telemetry-secrets.
# Service URLs use cluster DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
  namespace: telemetry
data:
  NODE_ENV: "production"

  # Use cluster Redis for shared state across replicas.
  REDIS_URL: "redis://redis:6379"

  # --- service discovery ---
  AUTH_URL: "http://auth-service:3001"
  DEVICE_REGISTRY_URL: "http://device-registry-service:3002"
  INGESTION_URL: "http://data-ingestion-service:3003"
  ALERT_SERVICE_URL: "http://alert-rules-service:3004"
  ALERT_URL: "http://alert-rules-service:3004"
  INSIGHT_URL: "http://insight-agent:3006"

  # The dashboard is a static site hosted outside the cluster — set this to its
  # origin. Left blank, every origin is allowed and each service warns at boot.
  CORS_ORIGIN: ""

  # Services speak plain HTTP. Configure Ingress TLS separately for HTTPS access.
  # Left set, they would look for certificate files that are not in the image.
  SSL_KEY_PATH: ""
  SSL_CERT_PATH: ""

  # --- auth-service ---
  JWT_EXPIRY: "1h"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_LOGIN_MAX: "10"
  RATE_LIMIT_REGISTER_MAX: "5"

  # --- device-registry-service ---
  STALE_AFTER_MS: "120000"
  SWEEP_INTERVAL_MS: "30000"

  # --- data-ingestion-service ---
  RING_BUFFER_SIZE: "50"
  # How long an idle device's live window survives in Redis. Long enough to
  # outlast a reporting gap, short enough that retired devices age out.
  RING_BUFFER_TTL_S: "21600"
  VIEWER_SCOPE_REFRESH_MS: "30000"
  # Must stay well below STALE_AFTER_MS, or a device is swept offline in the gap
  # between two liveness reports while it is publishing perfectly happily.
  LIVENESS_THROTTLE_MS: "30000"

  # --- alert-rules-service ---
  TEMP_THRESHOLD_C: "35"
  BATTERY_THRESHOLD_PCT: "20"
  ALERT_COOLDOWN_MS: "300000"
  MOTION_SHAKE_THRESHOLD: "25"
  SOUND_BASELINE_WINDOW: "20"
  SOUND_Z_SCORE_THRESHOLD: "2.5"
  # Same reasoning as RING_BUFFER_TTL_S: a device that stops reporting should
  # not hold its baseline window in Redis indefinitely.
  SOUND_BASELINE_TTL_S: "86400"
  ALERT_WEBHOOK_URL: ""

  # --- api-gateway ---
  # Upstreams are in-cluster and always warm, so this matters far less here than
  # on a platform that suspends idle services. Kept generous anyway.
  UPSTREAM_TIMEOUT_MS: "90000"
