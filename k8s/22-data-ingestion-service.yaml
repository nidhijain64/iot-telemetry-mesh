# REST and MQTT ingestion with shared Redis broker state and recent readings.
# Only the publisher's replica persists each reading (see broker.js).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-ingestion-service
  namespace: telemetry
spec:
  strategy:
    type: RollingUpdate
  replicas: 2
  selector:
    matchLabels: { app: data-ingestion-service }
  template:
    metadata:
      labels: { app: data-ingestion-service }
    spec:
      containers:
        - name: data-ingestion-service
          image: iot-telemetry-mesh-data-ingestion-service:latest
          # Images are loaded with minikube image load; do not pull from a registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          envFrom:
            - configMapRef: { name: telemetry-config }
            - secretRef: { name: telemetry-secrets }
          resources:
            # Reserve memory and CPU; cap memory while allowing CPU bursts.
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          # Readiness gates traffic: fail and the Pod is pulled out of the
          # Service, but nothing is restarted. This is what stops requests
          # reaching a Pod that is still connecting to MongoDB.
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          # Liveness restarts. Deliberately far more forgiving than readiness —
          # restarting a Pod that is merely busy makes an overload worse.
          livenessProbe:
            httpGet: { path: /health, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: data-ingestion-service
  namespace: telemetry
spec:
  selector: { app: data-ingestion-service }
  ports:
    - port: 3003
      targetPort: 3003
